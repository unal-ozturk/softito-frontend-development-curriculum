<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
    />
    <title>Document</title>
  </head>

  <body
    class="bg-gray-50 text-gray-800 font-sans min-h-screen p-8 flex flex-col items-center justify-center gap-6"
  >
    <div class="text-center max-w-md">
      <h1 class="text-xl font-bold tex-gray-900 mb-2">
        Sosyal Paylaşım Barları
      </h1>
      <p class="text-xs text-gray-500">
        Butonları Yatay Düzenleme Flex ve Flex-row ile
      </p>
    </div>

    <div
      class="w-full max-w-md border border-gray-200 rounded-xl p-4 flex flex-col justify-between items-center gap-3 shadow-sm"
    >
      <button
        class="flex-1 py-3 px-3 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-lg text-sm font-semibold text-gray-700 transition-colors"
      >
        Beğen
      </button>
      <button
        class="flex-1 py-2 px-3 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-lg text-xs font-semibold text-gray-700 transition-colors"
      >
        Paylaş
      </button>
      <button
        class="flex-1 py-2 px-3 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-lg text-xs font-semibold text-gray-700 transition-colors"
      >
        Yorum
      </button>
      <button
        class="py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition-colors"
      >
        Button 4
      </button>
    </div>
  </body>
</html>
