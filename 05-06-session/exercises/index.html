<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-8 flex justify-center">
  <div class="max-w-sm w-full bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold mb-6 text-slate-800">Giriş Yap</h1>

    <form action="" class="space-y-4">
      <div>
        <label for="" class="text-xs text-slate-600 mb-1 block">E-posta</label>
        <input class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500" type="email"
          placeholder="E-posta Adresinizi Giriniz" />
      </div>

      <div>
        <label for="">Şifre</label>
        <input class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500" type="password"
          placeholder="*****" />
      </div>

      <button type="submit" class="w-full bg-blue-500 text-white font-semibold py-2 rounded hover:bg-blue-600">
        Submit
      </button>
    </form>
  </div>
</body>

</html>
