<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Responsive - Inline Block Method Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-slate-100 p-8 flex flex-col items-center">
    <div id="main-card" class="max-w-xl w-full bg-white p-6 rounded shadow">
      <h1 class="text-xl font-bold mb-4">Tailwind Inline-Block Yöntemi</h1>

      <div class="flex flex-col gap-4">
        <div>
          <span class="text-xs text-slate-500 block mb-1">
            Yöntem 5: display: inline-block (Sığmayınca alt tarafa kayacak - md
            ekran altında)
          </span>

          <div class="bg-slate-50 p-3 border rounded text-[0px]">
            <div
              class="inline-block w-full md:w-[31%] mx-[1%] mb-4 md:mb-0 text-base text-center bg-blue-500 text-white p-3 rounded"
            >
              Kutu 1
            </div>
            <div
              class="inline-block w-full md:w-[31%] mx-[1%] mb-4 md:mb-0 text-base text-center bg-yellow-500 text-white p-3 rounded"
            >
              Kutu 2
            </div>
            <div
              class="inline-block w-full md:w-[31%] mx-[1%] text-base text-center bg-red-500 text-white p-3 rounded"
            >
              Kutu 3
            </div>
          </div>
        </div>

        <div>
          <span class="text-xs text-slate-500 block mb-1"
            >Flex (İki Uca Yaslama)</span
          >
          <div
            class="flex justify-between items-center bg-slate-50 p-3 border rounded"
          >
            <span class="font-semibold text-slate-700">Sol</span>
            <button class="bg-slate-800 text-white px-3 py-1.5 rounded text-sm">
              Sağ
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
