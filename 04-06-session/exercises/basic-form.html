<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    form.form-example {
      display: table;
    }

    div.form-example {
      display: table-row;
    }

    label,
    input {
      display: table-cell;
      margin-bottom: 10px;
    }

    label {
      padding-right: 10px;
    }
  </style>
</head>

<body>
  <form action="" method="get" class="form-example" id="my-form">

    <div class="form-example">
      <label for="name">Enter your name: </label>
      <input type="text" name="name" id="name" required />
    </div>

    <div class="form-example">
      <label for="lastname">Enter your last name: </label>
      <input type="text" name="lastname" id="lastname" required />
    </div>

    <div class="form-example">
      <label for="number">Enter your Phone Number: </label>
      <input type="tel" name="number" id="number" required />
    </div>


    <div class="form-example">
      <label for="file">Upload File Here: </label>
      <input type="file" name="file" id="file" required />
    </div>

    <div class="form-example">
      <input type="submit" value="Subscribe!" />
    </div>

  </form>

  <div class="my-info">

  </div>

  <script>

    const form = document.getElementById("my-form");
    const info = document.getElementById("my-info");
    const name = document.getElementById("name");
    const lastname = document.getElementById("lastname");
    const number = document.getElementById("number");


    form.addEventListener("submit", function (e) {
      e.preventDefault();
      info.innerHTML += name.value
    });


  </script>
</body>

</html>
